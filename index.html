<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hausa Assistant</title>
<style>
body{margin:0;height:100%;font-family:-apple-system,sans-serif;background:#f6f3ec;color:#201a12;display:flex;flex-direction:column}
header{padding:14px 16px;background:#fff;border-bottom:1px solid #e4dccb;display:flex;align-items:center;gap:10px}
header .logo{width:36px;height:36px;border-radius:10px;background:#1e7a4c;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px}
header h1{font-size:17px;margin:0} header p{margin:0;font-size:12px;color:#6b6355}
main{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;max-width:640px;width:100%;margin:0 auto;box-sizing:border-box}
.msg{max-width:82%;padding:10px 14px;border-radius:16px;line-height:1.45;font-size:15px;white-space:pre-wrap}
.msg.bot{background:#efe7d8;align-self:flex-start} .msg.user{background:#1e7a4c;color:#fff;align-self:flex-end}
.msg.error{background:#7a2020;color:#fff} .msg.typing{color:#6b6355;font-style:italic}
form{display:flex;gap:8px;padding:10px 16px;background:#fff;border-top:1px solid #e4dccb;max-width:640px;width:100%;margin:0 auto;box-sizing:border-box}
input{flex:1;padding:12px 14px;border-radius:12px;border:1px solid #e4dccb;font-size:15px}
button{background:#1e7a4c;color:#fff;border:none;padding:0 18px;border-radius:12px;font-size:15px;font-weight:600}
</style>
</head>
<body>
<header><div class="logo">🤖</div><div><h1>Hausa Assistant</h1><p>Fassara, tambayoyi, da taimako a Hausa</p></div></header>
<main id="chat"></main>
<form id="chatForm"><input type="text" id="input" placeholder="Rubuta tambayarka a nan..." autocomplete="off"><button type="submit" id="sendBtn">Aika</button></form>
<script>
const chat=document.getElementById('chat'),form=document.getElementById('chatForm'),input=document.getElementById('input'),sendBtn=document.getElementById('sendBtn');
let history=[];
function addMsg(t,w){const d=document.createElement('div');d.className='msg '+w;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
async function sendToBackend(m){const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m,history})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Kuskure');return d.reply}
form.addEventListener('submit',async e=>{e.preventDefault();const t=input.value.trim();if(!t)return;addMsg(t,'user');history.push({role:'user',content:t});input.value='';input.disabled=true;sendBtn.disabled=true;const ty=addMsg('Yana rubutawa...','bot typing');try{const r=await sendToBackend(t);ty.remove();addMsg(r,'bot');history.push({role:'assistant',content:r})}catch(err){ty.remove();addMsg('Yi hakuri, akwai kuskure: '+err.message,'error')}finally{input.disabled=false;sendBtn.disabled=false;input.focus()}});
addMsg("Sannu! Ni ne Hausa Assistant. Tambaye ni komai — fassara, aikin gida, ko rubuta sako.",'bot');
</script>
</body>
</html>
